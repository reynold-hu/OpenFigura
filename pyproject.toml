[project]
name = "openfigura"
version = "0.1.0"
description = "Local, agent-driven 3D asset production: generate, render, inspect, export with provenance."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "Reynold Hu" }]
keywords = ["3d", "asset-generation", "mcp", "pixal3d", "blender", "agent-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
detail = ["numpy>=1.26", "Pillow>=10"]
dev = ["openfigura[mcp]", "pytest>=8"]

[project.scripts]
openfigura = "openfigura.cli:main"
openfigura-mcp = "openfigura.mcp_server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openfigura._vendor" = ["*.txt"]
"openfigura.backends" = ["*.gd", "*.txt"]
